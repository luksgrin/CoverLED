name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease lintRelease

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "CoverLED-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "CoverLED-${GITHUB_REF_NAME}.aab"

      - name: GitHub Release with the APK (direct install)
        uses: softprops/action-gh-release@v2
        with:
          name: CoverLED ${{ github.ref_name }}
          files: CoverLED-${{ github.ref_name }}.apk
          # Fixed header (install steps) + GitHub's generated list of changes since the previous tag.
          body: |
            ## Install
            1. Download **`CoverLED-${{ github.ref_name }}.apk`** below on the phone and open it
               (allow installs from your browser when asked). Updating over a previous release keeps your settings.
            2. Open CoverLED → **Grant notification access** → allow.
            3. **Allow display over other apps** → allow (Android otherwise blocks the indicator while the phone is closed).

            Verified on Galaxy Z Flip5 (One UI 8.0) and Z Flip7 (One UI 8.5). Privacy: reads only which app
            posted a notification, never its content; no internet permission —
            [PRIVACY.md](https://github.com/luksgrin/CoverLED/blob/main/PRIVACY.md).

            ## Changes
          append_body: true
          generate_release_notes: true

      - name: Keep the AAB for Google Play upload
        uses: actions/upload-artifact@v4
        with:
          name: CoverLED-${{ github.ref_name }}-aab
          path: CoverLED-${{ github.ref_name }}.aab
          retention-days: 90
